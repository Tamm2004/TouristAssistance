{% extends 'base.html' %}
{% load static %}
{% block content %}
	<!-- <link rel="stylesheet" type="text/css" href='{%static "css\bootstrap.min.css" %}'> -->
	<link rel="stylesheet" type="text/css" href='{% static "customcss/form.css" %}'>
	<!-- <script src='{%static "js/bootstrap.bundle.min.js" %}'></script> -->

	<div class="row" style="margin-top: 66px;">
		<div class="col-md-5 image">
			<img src="{%static 'Photos/login.png' %}" style="padding-top: 1rem;">
		</div>
		<div class="col-md-7">
			<h1 class="animated-text"><strong>
	        Oops! Forgot Password

	        </strong></h1>

	        <div class="box">
				<h4>AmritPath</h4>
				<h6>Hey there! We just need your email to get your password.</h6>

				<form method="POST" action="">
				{% csrf_token %}

				<label for="email" class="fw-bold mt-2 d-flex justify-content-between">EMAIL *<span class="text-danger"> {% if ms == "Invalid email" %} Invalid Email {% endif %}</span></label>
				<input type="email" id="email" name="email" placeholder="Enter your email" class="txt form-control" required><br>

				<button type="submit" class="button search form-control btn fw-bold mt-3" >Submit</button><br><br>

				</form>
				
			</div>
		</div>
	</div> 
{% endblock %}
